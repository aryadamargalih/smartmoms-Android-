name: smartmoms
description: SmartMoms - Aplikasi Pemantau Kesehatan Ibu Hamil
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Charts
  fl_chart: ^0.68.0

  # State Management
  provider: ^6.1.5+1

  # UI Utilities
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Navigation
  go_router: ^13.2.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Utils
  intl: ^0.19.0

  # Splash Screen
  flutter_native_splash: ^2.4.0

  cupertino_icons: ^1.0.2
  http: ^1.6.0

  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

flutter_native_splash:
  color: "#ffffff"
